# This file was bootstrapped by the Firebase CLI and customized for repo deployments.

name: Deploy Firebase Hosting and Rules on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  build_and_deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup project tooling
        uses: ./.github/actions/setup-project
        with:

      - name: Build web
        run: flutter build web --wasm --release --base-href "/"

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting and rules
        run: firebase deploy --project sggw-days --only
          hosting,firestore:rules,storage:main --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
