name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  build_and_deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: "stable"

      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build web
        run: flutter build web --wasm --release --base-href "/"
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
          channelId: live
          projectId: sggw-days
