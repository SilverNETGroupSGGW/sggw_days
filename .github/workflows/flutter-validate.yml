name: Flutter Validate

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project

      - name: Verify generated files are up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "Generated files are out of date. Run build_runner and gen-l10n locally, then commit the results."
            git status --short --untracked-files=all
            git diff
            exit 1
          fi

      - name: Verify launcher icons are up to date
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
          fi
          dart run tool/generate_app_icons.dart
          dart run flutter_launcher_icons
          dart run tool/validate_android_icons.dart
          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "Launcher icons are out of date. Regenerate icons locally, then commit the results."
            git status --short --untracked-files=all
            git diff
            exit 1
          fi

      - name: Check formatting
        run: |
          paths="lib tool"
          if [ -d test ]; then
            paths="$paths test"
          fi
          dart format --output=none --set-exit-if-changed $paths

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests directory found; skipping tests."
          fi
