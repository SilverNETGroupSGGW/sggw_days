# This file was bootstrapped by the Firebase CLI and customized for repo deployments.

name: Firebase Verify and Manual Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Workflow mode.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - production

permissions:
  contents: read

concurrency:
  group: firebase-release-${{ github.event_name == 'workflow_dispatch' &&
    inputs.target || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  verify_builds:
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.target == 'verify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project
        with:
          node-version: "24"

      - name: Build web
        run: >-
          flutter build web --wasm --release --no-tree-shake-icons --base-href
          "/"

      - name: Prepare web deploy files
        env:
          APPLE_TEAM_ID: ${{ vars['APPLE_TEAM_ID'] }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars['IOS_BUNDLE_IDENTIFIER'] }}
        run: dart run tool/prepare_web_deploy.dart

  deploy_production:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project
        with:
          node-version: "24"

      - name: Build web
        run: >-
          flutter build web --wasm --release --no-tree-shake-icons --base-href
          "/"

      - name: Prepare web deploy files
        env:
          APPLE_TEAM_ID: ${{ vars['APPLE_TEAM_ID'] }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars['IOS_BUNDLE_IDENTIFIER'] }}
        run: dart run tool/prepare_web_deploy.dart

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting, Functions, and rules to production
        run: >-
          firebase deploy --project "sggw-days" --only
          "hosting:sggw-days,functions,firestore:rules,storage:main"
          --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
