name: Delivery

"on":
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
      - "*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      firebase_target:
        description: Firebase deploy target
        required: true
        type: choice
        default: beta
        options:
          - beta
          - prod

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    delivery-${{
      github.event_name == 'release' && github.event.release.tag_name ||
      startsWith(github.ref, 'refs/tags/') && github.ref_name ||
      github.event_name == 'workflow_dispatch' && format('firebase-{0}', github.event.inputs.firebase_target) ||
      format('{0}-{1}', github.event_name, github.ref_name || github.run_id)
    }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_manual_firebase: ${{ steps.resolve.outputs.is_manual_firebase }}
      should_build_candidate_artifacts: ${{ steps.resolve.outputs.should_build_candidate_artifacts }}
      should_build_web: ${{ steps.resolve.outputs.should_build_web }}
      should_deploy_beta_hosting: ${{ steps.resolve.outputs.should_deploy_beta_hosting }}
      should_deploy_live_firebase: ${{ steps.resolve.outputs.should_deploy_live_firebase }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Resolve workflow mode
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          MANUAL_FIREBASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.firebase_target || '' }}
        run: |
          set -euo pipefail

          is_tag=false
          is_release=false
          is_manual_firebase=false
          should_build_candidate_artifacts=false
          should_build_web=false
          should_deploy_beta_hosting=false
          should_deploy_live_firebase=false
          release_tag=""
          build_number=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            is_manual_firebase=true
            should_build_web=true

            case "$MANUAL_FIREBASE_TARGET" in
              beta)
                should_deploy_beta_hosting=true
                ;;
              prod)
                should_deploy_live_firebase=true
                ;;
              *)
                echo "Unsupported firebase_target: $MANUAL_FIREBASE_TARGET"
                exit 1
                ;;
            esac
          elif [ "$EVENT_NAME" = "release" ]; then
            is_release=true
            should_deploy_live_firebase=true
            release_tag="$RELEASE_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            is_tag=true
            should_build_candidate_artifacts=true
            should_build_web=true
            should_deploy_beta_hosting=true
            release_tag="$REF_NAME"
          fi

          if [ "$is_release" = "true" ] || [ "$should_build_candidate_artifacts" = "true" ]; then
            release_tag="${release_tag#refs/tags/}"

            if [ -z "$release_tag" ]; then
              echo "Release tag could not be resolved for $EVENT_NAME event."
              exit 1
            fi

            release_version="${release_tag#v}"

            if ! [[ "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release version must match X.Y.Z or vX.Y.Z, got: $release_tag"
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            if [ "$major" -gt 2099 ] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
              echo "Release version components must satisfy major <= 2099, minor <= 99, patch <= 99."
              exit 1
            fi

            build_number=$((major * 1000000 + minor * 10000 + patch * 100 + 1))
          fi

          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "is_manual_firebase=$is_manual_firebase" >> "$GITHUB_OUTPUT"
          echo "should_build_candidate_artifacts=$should_build_candidate_artifacts" >> "$GITHUB_OUTPUT"
          echo "should_build_web=$should_build_web" >> "$GITHUB_OUTPUT"
          echo "should_deploy_beta_hosting=$should_deploy_beta_hosting" >> "$GITHUB_OUTPUT"
          echo "should_deploy_live_firebase=$should_deploy_live_firebase" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  validate:
    needs:
      - resolve
    if: ${{ needs.resolve.outputs.should_build_candidate_artifacts == 'true' || needs.resolve.outputs.should_build_web == 'true' }}
    uses: ./.github/workflows/flutter-validate.yml

  build_android:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_candidate_artifacts == 'true' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: testing
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: android-release
      deploy_to_store: false
    secrets: inherit

  build_web:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project

      - name: Build web
        run: >-
          flutter build web --wasm --release --no-tree-shake-icons --base-href
          "/"

      - name: Prepare web deploy files
        env:
          APPLE_TEAM_ID: ${{ vars['APPLE_TEAM_ID'] }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars['IOS_BUNDLE_IDENTIFIER'] }}
        run: dart run tool/prepare_web_deploy.dart

      - name: Stage web release artifact
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/web-release"
          mkdir -p "$artifact_dir/build"
          cp -R build/web "$artifact_dir/build/web"

          (
            cd build/web
            zip -rq "$artifact_dir/sggw-days-web.zip" .
          )

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: ${{ runner.temp }}/web-release
          if-no-files-found: error
          compression-level: 0

  build_ios:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_candidate_artifacts == 'true' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: testflight
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: ios-release
      deploy_to_store: false
    secrets: inherit

  locate_release_candidate:
    needs:
      - resolve
    if: ${{ needs.resolve.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
      head_sha: ${{ steps.locate.outputs.head_sha }}
    steps:
      - name: Locate successful tag candidate run
        id: locate
        uses: actions/github-script@v8
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          WORKFLOW_PATH: .github/workflows/store-release.yml
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            const tag = process.env.RELEASE_TAG.replace(/^refs\/tags\//, '');
            const workflowPath = process.env.WORKFLOW_PATH;
            const waitMs = 30_000;
            const maxAttempts = 40;

            async function resolveTagCommitSha() {
              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              if (ref.data.object.type === 'tag') {
                const annotatedTag = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: ref.data.object.sha,
                });
                return annotatedTag.data.object.sha;
              }

              return ref.data.object.sha;
            }

            const tagSha = await resolveTagCommitSha();
            core.info(`Waiting for successful push candidate run for tag ${tag} (${tagSha}).`);

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const matches = [];

              for (let page = 1; page <= 5; page += 1) {
                const response = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  branch: tag,
                  event: 'push',
                  per_page: 100,
                  page,
                });

                matches.push(...response.data.workflow_runs.filter((run) =>
                  run.path === workflowPath &&
                  run.id !== currentRunId
                ));

                if (response.data.workflow_runs.length < 100) {
                  break;
                }
              }

              if (matches.length === 0) {
                for (let page = 1; page <= 5; page += 1) {
                  const response = await github.rest.actions.listWorkflowRunsForRepo({
                    owner,
                    repo,
                    event: 'push',
                    per_page: 100,
                    page,
                  });

                  matches.push(...response.data.workflow_runs.filter((run) =>
                    run.path === workflowPath &&
                    run.id !== currentRunId &&
                    (run.head_sha === tagSha || run.head_branch === tag)
                  ));

                  if (response.data.workflow_runs.length < 100) {
                    break;
                  }
                }
              }

              matches.sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
              const candidate = matches[0];

              if (!candidate) {
                core.info(`No matching push run found yet (attempt ${attempt}/${maxAttempts}).`);
              } else {
                core.info(`Latest candidate run ${candidate.id} is ${candidate.status}/${candidate.conclusion ?? 'pending'}.`);

                if (candidate.status !== 'completed') {
                  core.info('Candidate run is still in progress. Waiting for completion.');
                } else if (candidate.conclusion !== 'success') {
                  throw new Error(`Tag candidate run ${candidate.id} for ${tag} finished with conclusion ${candidate.conclusion}.`);
                } else {
                  core.setOutput('run_id', String(candidate.id));
                  core.setOutput('head_sha', candidate.head_sha);
                  return;
                }
              }

              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, waitMs));
              }
            }

            throw new Error(`Timed out waiting for a successful push candidate run for tag ${tag}.`);

  release_assets:
    needs:
      - resolve
      - locate_release_candidate
      - android_production
      - ios_app_store
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.locate_release_candidate.result == 'success' && needs.android_production.result == 'success' && needs.ios_app_store.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download candidate Android artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: android-release
          path: release-assets/android
          repository: ${{ github.repository }}
          run-id: ${{ needs.locate_release_candidate.outputs.run_id }}

      - name: Download candidate web artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: web-release
          path: release-assets/web
          repository: ${{ github.repository }}
          run-id: ${{ needs.locate_release_candidate.outputs.run_id }}

      - name: Download candidate iOS artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: ios-release
          path: release-assets/ios
          repository: ${{ github.repository }}
          run-id: ${{ needs.locate_release_candidate.outputs.run_id }}

      - name: Attach release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/android/sggw-days-android.apk
            release-assets/web/sggw-days-web.zip
            release-assets/ios/sggw-days-ios.ipa

  deploy_beta_hosting:
    needs:
      - resolve
      - build_web
    if: ${{ always() && needs.resolve.outputs.should_deploy_beta_hosting == 'true' && needs.build_web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-release
          path: ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy beta Firebase Hosting
        run: firebase deploy --project "sggw-days" --only "hosting:beta" --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  deploy_live_firebase:
    needs:
      - resolve
      - build_web
      - locate_release_candidate
      - android_production
      - ios_app_store
    if: >-
      ${{
        always() &&
        needs.resolve.outputs.should_deploy_live_firebase == 'true' &&
        (
          (
            needs.resolve.outputs.is_release == 'true' &&
            needs.locate_release_candidate.result == 'success' &&
            needs.android_production.result == 'success' &&
            needs.ios_app_store.result == 'success'
          ) || (
            needs.resolve.outputs.is_manual_firebase == 'true' &&
            needs.build_web.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download web build artifact from current run
        if: ${{ needs.resolve.outputs.is_manual_firebase == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: web-release
          path: ${{ github.workspace }}

      - name: Download web build artifact from candidate run
        if: ${{ needs.resolve.outputs.is_release == 'true' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: web-release
          path: ${{ github.workspace }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.locate_release_candidate.outputs.run_id }}

      - name: Setup deploy tooling
        uses: ./.github/actions/setup-project
        with:
          install-flutter: false
          node-version: "24"

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy live Firebase Hosting, Functions, and rules
        run: >-
          firebase deploy --project "sggw-days" --only
          "hosting:live,functions,firestore:rules,storage:main"
          --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  android_testing:
    needs:
      - resolve
      - build_android
    if: ${{ always() && needs.resolve.outputs.is_tag == 'true' && needs.build_android.result == 'success' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: testing
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: android-release
    secrets: inherit

  ios_testflight:
    needs:
      - resolve
      - build_ios
    if: ${{ always() && needs.resolve.outputs.is_tag == 'true' && needs.build_ios.result == 'success' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: testflight
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: ios-release
    secrets: inherit

  android_production:
    needs:
      - resolve
      - locate_release_candidate
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.locate_release_candidate.result == 'success' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: production
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      release_body: ${{ github.event.release.body }}
    secrets: inherit

  ios_app_store:
    needs:
      - resolve
      - locate_release_candidate
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.locate_release_candidate.result == 'success' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: app_store
      release_version: ${{ needs.resolve.outputs.release_tag }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      release_body: ${{ github.event.release.body }}
    secrets: inherit
