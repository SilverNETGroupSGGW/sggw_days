name: Delivery

"on":
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
      - "*.*.*"
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      should_build_release_artifacts: ${{ steps.resolve.outputs.should_build_release_artifacts }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Resolve workflow mode
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail

          is_tag=false
          is_release=false
          should_build_release_artifacts=false
          release_tag=""
          build_number=""

          if [ "$EVENT_NAME" = "release" ]; then
            is_release=true
            should_build_release_artifacts=true
            release_tag="$RELEASE_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            is_tag=true
            should_build_release_artifacts=true
            release_tag="$REF_NAME"
          fi

          if [ "$should_build_release_artifacts" = "true" ]; then
            release_tag="${release_tag#refs/tags/}"

            if [ -z "$release_tag" ]; then
              echo "Release tag could not be resolved for $EVENT_NAME event."
              exit 1
            fi

            release_version="${release_tag#v}"

            if ! [[ "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release version must match X.Y.Z or vX.Y.Z, got: $release_tag"
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            if [ "$major" -gt 2099 ] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
              echo "Release version components must satisfy major <= 2099, minor <= 99, patch <= 99."
              exit 1
            fi

            build_number=$((major * 1000000 + minor * 10000 + patch * 100 + 1))
          fi

          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "should_build_release_artifacts=$should_build_release_artifacts" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  validate:
    uses: ./.github/workflows/flutter-validate.yml

  build_android:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_release_artifacts == 'true' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: testing
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: android-release
      deploy_to_store: false
    secrets: inherit

  build_web:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_release_artifacts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project

      - name: Build web
        run: >-
          flutter build web --wasm --release --no-tree-shake-icons --base-href
          "/"

      - name: Prepare web deploy files
        env:
          APPLE_TEAM_ID: ${{ vars['APPLE_TEAM_ID'] }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars['IOS_BUNDLE_IDENTIFIER'] }}
        run: dart run tool/prepare_web_deploy.dart

      - name: Stage web release artifact
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/web-release"
          mkdir -p "$artifact_dir/build"
          cp -R build/web "$artifact_dir/build/web"

          (
            cd build/web
            zip -rq "$artifact_dir/sggw-days-web.zip" .
          )

      - name: Upload web build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-release
          path: ${{ runner.temp }}/web-release
          if-no-files-found: error
          compression-level: 0

  build_ios:
    needs:
      - resolve
      - validate
    if: ${{ always() && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.resolve.outputs.should_build_release_artifacts == 'true' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: testflight
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: ios-release
      deploy_to_store: false
    secrets: inherit

  release_assets:
    needs:
      - resolve
      - build_android
      - build_web
      - build_ios
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.build_android.result == 'success' && needs.build_web.result == 'success' && needs.build_ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-release
          path: release-assets/android

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-release
          path: release-assets/web

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-release
          path: release-assets/ios

      - name: Attach release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/android/sggw-days-android.apk
            release-assets/web/sggw-days-web.zip
            release-assets/ios/sggw-days-ios.ipa

  deploy_beta_hosting:
    needs:
      - resolve
      - build_web
    if: ${{ always() && needs.resolve.outputs.is_tag == 'true' && needs.build_web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download web build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-release
          path: ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy beta Firebase Hosting
        run: firebase deploy --project "sggw-days" --only "hosting:beta" --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  deploy_live_firebase:
    needs:
      - resolve
      - build_web
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.build_web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download web build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-release
          path: ${{ github.workspace }}

      - name: Setup deploy tooling
        uses: ./.github/actions/setup-project
        with:
          install-flutter: false
          node-version: "24"

      - name: Prepare Firebase service account
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy live Firebase Hosting, Functions, and rules
        run: >-
          firebase deploy --project "sggw-days" --only
          "hosting:live,functions,firestore:rules,storage:main"
          --non-interactive

      - name: Clean up Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  android_testing:
    needs:
      - resolve
      - build_android
    if: ${{ always() && needs.resolve.outputs.is_tag == 'true' && needs.build_android.result == 'success' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: testing
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: android-release
    secrets: inherit

  ios_testflight:
    needs:
      - resolve
      - build_ios
    if: ${{ always() && needs.resolve.outputs.is_tag == 'true' && needs.build_ios.result == 'success' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: testflight
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      artifact_name: ios-release
    secrets: inherit

  android_production:
    needs:
      - resolve
      - build_android
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.build_android.result == 'success' }}
    uses: ./.github/workflows/android-store.yml
    with:
      target: production
      release_version: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      release_body: ${{ github.event.release.body }}
    secrets: inherit

  ios_app_store:
    needs:
      - resolve
      - build_ios
    if: ${{ always() && needs.resolve.outputs.is_release == 'true' && needs.build_ios.result == 'success' }}
    uses: ./.github/workflows/ios-store.yml
    with:
      target: app_store
      release_version: ${{ needs.resolve.outputs.release_tag }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      build_number: ${{ needs.resolve.outputs.build_number }}
      release_body: ${{ github.event.release.body }}
    secrets: inherit
