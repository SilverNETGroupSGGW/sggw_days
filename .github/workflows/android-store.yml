name: Android Store Release

on:
    push:
        tags:
            - "v*.*.*"
            - "*.*.*"
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            target:
                description: Store target to run manually.
                required: true
                type: choice
                options:
                    - testing
                    - production
            release_version:
                description: Optional semver release version (for example 1.2.3). Tag pushes
                    and GitHub Releases derive this automatically.
                required: false
                type: string
            play_track:
                description: Google Play testing track name. Used for testing uploads.
                required: false
                type: string
            release_status:
                description: Google Play release status. Used for testing uploads and can
                    override the production promotion status.
                required: false
                type: string
            build_number:
                description: Optional Android versionCode override. Tag builds and production
                    promotions default to the semver-derived build number.
                required: false
                type: string
            commit_range:
                description: Optional git revision range for autogenerated testing release notes.
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: "android-store-${{ github.event.inputs.target || github.event.release.tag_name || github.ref }}"
    cancel-in-progress: true

env:
    GOOGLE_PLAY_DEFAULT_TESTING_TRACK: beta
    GOOGLE_PLAY_DEFAULT_PRODUCTION_TRACK: production
    GOOGLE_PLAY_DEFAULT_STATUS: completed
    GOOGLE_PLAY_BUILD_NUMBER_OFFSET: 100000
    GOOGLE_PLAY_DEFAULT_PACKAGE_NAME: com.silvernet.sggw_days

jobs:
    resolve:
        if: "${{ github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease) }}"
        runs-on: ubuntu-latest
        outputs:
            target: ${{ steps.resolve.outputs.target }}
            build_name: ${{ steps.resolve.outputs.build_name }}
            build_number: ${{ steps.resolve.outputs.build_number }}
            package_name: ${{ steps.resolve.outputs.package_name }}
            play_track: ${{ steps.resolve.outputs.play_track }}
            source_track: ${{ steps.resolve.outputs.source_track }}
            target_track: ${{ steps.resolve.outputs.target_track }}
            release_status: ${{ steps.resolve.outputs.release_status }}
        steps:
            - name: Resolve Android store configuration
              id: resolve
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  INPUT_TARGET: ${{ github.event.inputs.target }}
                  INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
                  INPUT_TRACK: ${{ github.event.inputs.play_track }}
                  INPUT_STATUS: ${{ github.event.inputs.release_status }}
                  INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
                  BUILD_NUMBER_OFFSET: ${{ vars['GOOGLE_PLAY_BUILD_NUMBER_OFFSET'] }}
                  DEFAULT_BUILD_NUMBER_OFFSET: ${{ env.GOOGLE_PLAY_BUILD_NUMBER_OFFSET }}
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  TESTING_TRACK: ${{ vars['GOOGLE_PLAY_TESTING_TRACK'] }}
                  DEFAULT_TESTING_TRACK: ${{ env.GOOGLE_PLAY_DEFAULT_TESTING_TRACK }}
                  TESTING_STATUS: ${{ vars['GOOGLE_PLAY_TESTING_STATUS'] }}
                  PRODUCTION_TRACK: ${{ vars['GOOGLE_PLAY_PRODUCTION_TRACK'] }}
                  DEFAULT_PRODUCTION_TRACK: ${{ env.GOOGLE_PLAY_DEFAULT_PRODUCTION_TRACK }}
                  PRODUCTION_STATUS: ${{ vars['GOOGLE_PLAY_PRODUCTION_STATUS'] }}
                  DEFAULT_STATUS: ${{ env.GOOGLE_PLAY_DEFAULT_STATUS }}
                  PACKAGE_NAME: ${{ vars['GOOGLE_PLAY_PACKAGE_NAME'] }}
                  DEFAULT_PACKAGE_NAME: ${{ env.GOOGLE_PLAY_DEFAULT_PACKAGE_NAME }}
              run: |
                  set -euo pipefail

                  target="${INPUT_TARGET:-}"
                  if [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    target="testing"
                  elif [ "$EVENT_NAME" = "release" ]; then
                    target="production"
                  fi

                  case "$target" in
                    testing|production)
                      ;;
                    *)
                      echo "Android target must be testing or production, got: ${target:-<empty>}"
                      exit 1
                      ;;
                  esac

                  release_version="${INPUT_RELEASE_VERSION:-}"
                  if [ "$target" = "testing" ] && [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    release_version="$REF_NAME"
                  elif [ "$target" = "production" ] && [ "$EVENT_NAME" = "release" ]; then
                    release_version="${RELEASE_TAG:-$release_version}"
                  fi

                  release_version="${release_version#refs/tags/}"
                  release_version="${release_version#v}"

                  build_name=""
                  build_number="${INPUT_BUILD_NUMBER:-}"

                  if [ -n "$release_version" ]; then
                    if ! [[ "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "Release version must match X.Y.Z or vX.Y.Z for store deployment, got: $release_version"
                      exit 1
                    fi

                    major="${BASH_REMATCH[1]}"
                    minor="${BASH_REMATCH[2]}"
                    patch="${BASH_REMATCH[3]}"

                    if [ "$major" -gt 2099 ] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
                      echo "Release version components must satisfy major <= 2099, minor <= 99, patch <= 99."
                      exit 1
                    fi

                    build_name="$release_version"
                    if [ -z "$build_number" ]; then
                      build_number=$((major * 1000000 + minor * 10000 + patch * 100 + 1))
                    fi
                  elif [ "$target" = "production" ]; then
                    echo "release_version is required for Google Play production promotion."
                    exit 1
                  fi

                  if [ -z "$build_number" ]; then
                    build_number_offset="${BUILD_NUMBER_OFFSET:-$DEFAULT_BUILD_NUMBER_OFFSET}"
                    build_number=$((build_number_offset + (RUN_NUMBER * 100) + RUN_ATTEMPT))
                  fi

                  if ! [[ "$build_number" =~ ^[0-9]+$ ]]; then
                    echo "Android build number must be a positive integer, got: $build_number"
                    exit 1
                  fi

                  if [ "$build_number" -le 0 ] || [ "$build_number" -gt 2100000000 ]; then
                    echo "Android build number must be between 1 and 2100000000, got: $build_number"
                    exit 1
                  fi

                  package_name="${PACKAGE_NAME:-$DEFAULT_PACKAGE_NAME}"
                  play_track=""
                  source_track=""
                  target_track=""

                  if [ "$target" = "testing" ]; then
                    play_track="${INPUT_TRACK:-${TESTING_TRACK:-$DEFAULT_TESTING_TRACK}}"
                    release_status="${INPUT_STATUS:-${TESTING_STATUS:-$DEFAULT_STATUS}}"

                    if [ -z "$play_track" ] || [ -z "$package_name" ]; then
                      echo "Google Play track and package name are required for testing uploads."
                      exit 1
                    fi
                  else
                    source_track="${TESTING_TRACK:-$DEFAULT_TESTING_TRACK}"
                    target_track="${PRODUCTION_TRACK:-$DEFAULT_PRODUCTION_TRACK}"
                    release_status="${INPUT_STATUS:-${PRODUCTION_STATUS:-$DEFAULT_STATUS}}"

                    if [ -z "$source_track" ] || [ -z "$target_track" ] || [ -z "$package_name" ]; then
                      echo "Google Play source track, target track, and package name are required for production promotion."
                      exit 1
                    fi
                  fi

                  case "$release_status" in
                    completed|inProgress|halted|draft)
                      ;;
                    *)
                      echo "Unsupported Google Play release status: $release_status"
                      exit 1
                      ;;
                  esac

                  echo "target=$target" >> "$GITHUB_OUTPUT"
                  echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
                  echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
                  echo "play_track=$play_track" >> "$GITHUB_OUTPUT"
                  echo "source_track=$source_track" >> "$GITHUB_OUTPUT"
                  echo "target_track=$target_track" >> "$GITHUB_OUTPUT"
                  echo "release_status=$release_status" >> "$GITHUB_OUTPUT"

    validate:
        needs: resolve
        if: ${{ needs.resolve.outputs.target == 'testing' }}
        uses: ./.github/workflows/flutter-validate.yml

    build_and_deploy:
        needs:
            - resolve
            - validate
        if: ${{ needs.resolve.outputs.target == 'testing' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup project tooling
              uses: ./.github/actions/setup-project
              with:
                  java-version: "21"

            - name: Create keystore from secret
              shell: bash
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

            - name: Build app bundle
              env:
                  BUILD_NAME: ${{ needs.resolve.outputs.build_name }}
                  BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
                  KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
                  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
              run: |
                  set -euo pipefail

                  build_args=(--release --no-tree-shake-icons --build-number "$BUILD_NUMBER")
                  if [ -n "${BUILD_NAME:-}" ]; then
                    build_args+=(--build-name "$BUILD_NAME")
                  fi

                  flutter build appbundle "${build_args[@]}"

            - name: Resolve Android artifacts
              id: artifacts
              run: |
                  set -euo pipefail

                  aab_path="build/app/outputs/bundle/release/app-release.aab"
                  if [ ! -f "$aab_path" ]; then
                    echo "Expected Android App Bundle not found at $aab_path"
                    exit 1
                  fi

                  echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

                  mapping_path="build/app/outputs/mapping/release/mapping.txt"
                  if [ -f "$mapping_path" ]; then
                    echo "mapping_path=$mapping_path" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate Play testing release notes
              id: release_notes
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_RANGE: ${{ github.event.inputs.commit_range }}
                  REF_TYPE: ${{ github.ref_type }}
                  CURRENT_SHA: ${{ github.sha }}
                  BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
              run: |
                  set -euo pipefail

                  commit_range="${INPUT_RANGE:-}"
                  if [ -z "$commit_range" ] && [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_SHA}^" 2>/dev/null || true)
                    if [ -n "$previous_tag" ]; then
                      commit_range="$previous_tag..$CURRENT_SHA"
                    else
                      commit_range="$CURRENT_SHA"
                    fi
                  fi

                  if [ -z "$commit_range" ]; then
                    if git rev-parse HEAD^ >/dev/null 2>&1; then
                      commit_range="HEAD^..HEAD"
                    else
                      commit_range="HEAD"
                    fi
                  fi

                  notes=$(git log --format='- %s' --no-merges "$commit_range")
                  if [ -z "$notes" ]; then
                    notes=$(git log --format='- %s' -n 1 "$CURRENT_SHA")
                  fi

                  metadata_path="$RUNNER_TEMP/fastlane/metadata/android"
                  changelog_dir="$metadata_path/en-US/changelogs"
                  mkdir -p "$changelog_dir"
                  printf '%s\n' "$notes" > "$changelog_dir/${BUILD_NUMBER}.txt"

                  echo "metadata_path=$metadata_path" >> "$GITHUB_OUTPUT"

            - name: Setup fastlane
              uses: ./.github/actions/setup-fastlane

            - name: Upload build to Google Play testing
              env:
                  FASTLANE_DISABLE_COLORS: "1"
                  FASTLANE_SKIP_UPDATE_CHECK: "1"
                  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
                  GOOGLE_PLAY_PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
                  GOOGLE_PLAY_AAB_PATH: ${{ steps.artifacts.outputs.aab_path }}
                  GOOGLE_PLAY_TRACK: ${{ needs.resolve.outputs.play_track }}
                  GOOGLE_PLAY_RELEASE_STATUS: ${{ needs.resolve.outputs.release_status }}
                  GOOGLE_PLAY_METADATA_PATH: ${{ steps.release_notes.outputs.metadata_path }}
                  GOOGLE_PLAY_MAPPING_PATH: ${{ steps.artifacts.outputs.mapping_path }}
                  GOOGLE_PLAY_VERSION_NAME: ${{ needs.resolve.outputs.build_name }}
                  GOOGLE_PLAY_VERSION_CODE: ${{ needs.resolve.outputs.build_number }}
              run: fastlane android deploy_play_testing

            - name: Clean up sensitive files
              if: always()
              run: |
                  rm -f android/app/upload-keystore.jks

    promote_existing_release:
        needs: resolve
        if: ${{ needs.resolve.outputs.target == 'production' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Generate production release notes
              id: release_notes
              env:
                  RELEASE_BODY: ${{ github.event.release.body }}
                  RELEASE_NAME: ${{ github.event.release.name }}
                  RELEASE_VERSION: ${{ needs.resolve.outputs.build_name }}
                  BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
              run: |
                  set -euo pipefail

                  raw_notes="${RELEASE_BODY:-}"
                  if [ -z "$raw_notes" ]; then
                    raw_notes="${RELEASE_NAME:-Release ${RELEASE_VERSION}}"
                  fi

                  metadata_path="$RUNNER_TEMP/fastlane/metadata/android"
                  changelog_dir="$metadata_path/en-US/changelogs"
                  mkdir -p "$changelog_dir"
                  printf '%s\n' "$raw_notes" > "$changelog_dir/${BUILD_NUMBER}.txt"

                  echo "metadata_path=$metadata_path" >> "$GITHUB_OUTPUT"

            - name: Setup fastlane
              uses: ./.github/actions/setup-fastlane

            - name: Promote testing build to Google Play production
              env:
                  FASTLANE_DISABLE_COLORS: "1"
                  FASTLANE_SKIP_UPDATE_CHECK: "1"
                  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
                  GOOGLE_PLAY_PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
                  GOOGLE_PLAY_SOURCE_TRACK: ${{ needs.resolve.outputs.source_track }}
                  GOOGLE_PLAY_TARGET_TRACK: ${{ needs.resolve.outputs.target_track }}
                  GOOGLE_PLAY_RELEASE_STATUS: ${{ needs.resolve.outputs.release_status }}
                  GOOGLE_PLAY_METADATA_PATH: ${{ steps.release_notes.outputs.metadata_path }}
                  GOOGLE_PLAY_VERSION_NAME: ${{ needs.resolve.outputs.build_name }}
                  GOOGLE_PLAY_VERSION_CODE: ${{ needs.resolve.outputs.build_number }}
              run: fastlane android promote_play_production