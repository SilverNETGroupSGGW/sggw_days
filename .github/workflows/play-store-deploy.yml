name: Deploy to Google Play Store

on:
    push:
        branches: [ main ]
    workflow_dispatch:
        inputs:
            play_track:
                description: Google Play track name. Use beta for public testing or a custom closed-testing track name.
                required: false
                type: string
            release_status:
                description: Google Play release status. Use completed for fully automatic tester rollout.
                required: false
                type: string
            build_number:
                description: Optional Android versionCode override. Defaults to a unique CI-generated value.
                required: false
                type: string
            commit_range:
                description: Optional git revision range for autogenerated release notes
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: play-store-${{ github.ref }}
    cancel-in-progress: true

env:
    GOOGLE_PLAY_DEFAULT_TRACK: beta
    GOOGLE_PLAY_DEFAULT_STATUS: completed
    GOOGLE_PLAY_BUILD_NUMBER_OFFSET: 100000

jobs:
    validate:
        uses: ./.github/workflows/flutter-validate.yml

    build_and_deploy:
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup project tooling
              uses: ./.github/actions/setup-project
              with:
                  java-version: "21"

            - name: Resolve Play release configuration
              id: resolve_release
              env:
                  INPUT_TRACK: ${{ github.event.inputs.play_track }}
                  DEFAULT_TRACK: ${{ env.GOOGLE_PLAY_DEFAULT_TRACK }}
                  INPUT_STATUS: ${{ github.event.inputs.release_status }}
                  DEFAULT_STATUS: ${{ env.GOOGLE_PLAY_DEFAULT_STATUS }}
                  INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
                  BUILD_NUMBER_OFFSET: ${{ env.GOOGLE_PLAY_BUILD_NUMBER_OFFSET }}
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  set -euo pipefail

                  play_track="${INPUT_TRACK:-$DEFAULT_TRACK}"
                  release_status="${INPUT_STATUS:-$DEFAULT_STATUS}"

                  if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
                      build_number="$INPUT_BUILD_NUMBER"
                  else
                      build_number=$((BUILD_NUMBER_OFFSET + (RUN_NUMBER * 100) + RUN_ATTEMPT))
                  fi

                  if [ -z "$play_track" ]; then
                      echo "A Google Play track name is required."
                      echo "Set GOOGLE_PLAY_DEFAULT_TRACK at the top of this workflow for push-based deploys,"
                      echo "or provide the play_track workflow_dispatch input for manual runs."
                      exit 1
                  fi

                  case "$release_status" in
                      completed|inProgress|halted|draft)
                          ;;
                      *)
                          echo "Unsupported Google Play release status: $release_status"
                          exit 1
                          ;;
                  esac

                  if ! [[ "$build_number" =~ ^[0-9]+$ ]]; then
                      echo "Android build number must be a positive integer, got: $build_number"
                      exit 1
                  fi

                  if [ "$build_number" -le 0 ] || [ "$build_number" -gt 2100000000 ]; then
                      echo "Android build number must be between 1 and 2100000000, got: $build_number"
                      exit 1
                  fi

                  echo "play_track=$play_track" >> "$GITHUB_OUTPUT"
                  echo "release_status=$release_status" >> "$GITHUB_OUTPUT"
                  echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

            - name: Create keystore from secret
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
              shell: bash

            - name: Build app bundle
              env:
                  KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
                  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
                  BUILD_NUMBER: ${{ steps.resolve_release.outputs.build_number }}
              run: |
                  flutter build appbundle --release --build-number "$BUILD_NUMBER"

            - name: Generate Play release notes from commit messages
              id: release_notes
              env:
                  INPUT_RANGE: ${{ github.event.inputs.commit_range }}
                  BEFORE_SHA: ${{ github.event.before }}
                  CURRENT_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  whatsnew_dir="$RUNNER_TEMP/whatsnew"
                  notes_file="$whatsnew_dir/whatsnew-en-US"
                  mkdir -p "$whatsnew_dir"

                  commit_range="${INPUT_RANGE:-}"
                  if [ -z "$commit_range" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                      commit_range="$BEFORE_SHA..$CURRENT_SHA"
                  fi

                  if [ -z "$commit_range" ]; then
                      if git rev-parse HEAD^ >/dev/null 2>&1; then
                          commit_range="HEAD^..HEAD"
                      else
                          commit_range="HEAD"
                      fi
                  fi

                  git log --format='- %s' --no-merges "$commit_range" > "$notes_file"

                  if [ ! -s "$notes_file" ]; then
                      git log --format='- %s' -n 1 "$CURRENT_SHA" > "$notes_file"
                  fi

                  echo "whatsnew_dir=$whatsnew_dir" >> "$GITHUB_OUTPUT"
                  echo "commit_range=$commit_range" >> "$GITHUB_OUTPUT"

            - name: Upload to Google Play
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
                  packageName: com.silvernet.sggw_days
                  releaseFiles: "build/app/outputs/bundle/release/app-release.aab"
                  tracks: ${{ steps.resolve_release.outputs.play_track }}
                  status: ${{ steps.resolve_release.outputs.release_status }}
                  whatsNewDirectory: ${{ steps.release_notes.outputs.whatsnew_dir }}
                  mappingFile: build/app/outputs/mapping/release/mapping.txt

            - name: Clean up sensitive files
              if: always()
              run: |
                  rm -f android/app/upload-keystore.jks
