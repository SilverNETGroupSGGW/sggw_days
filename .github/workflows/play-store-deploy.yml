name: Deploy to Google Play Store (Closed Testing)

on:
    push:
        branches: [ main ]
    workflow_dispatch:
        inputs:
            play_track:
                description: Closed testing track name from Google Play Console
                required: false
                type: string
            commit_range:
                description: Optional git revision range for autogenerated release notes
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: play-store-${{ github.ref }}
    cancel-in-progress: true

env:
    GOOGLE_PLAY_CLOSED_TRACK: alpha

jobs:
    validate:
        uses: ./.github/workflows/flutter-validate.yml

    build_and_deploy:
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup project tooling
              uses: ./.github/actions/setup-project
              with:
                  java-version: "21"

            - name: Resolve closed testing track
              id: resolve_track
              env:
                  INPUT_TRACK: ${{ github.event.inputs.play_track }}
                  DEFAULT_TRACK: ${{ env.GOOGLE_PLAY_CLOSED_TRACK }}
              run: |
                  set -euo pipefail

                  play_track="${INPUT_TRACK:-$DEFAULT_TRACK}"

                  if [ -z "$play_track" ]; then
                      echo "A closed testing track name is required."
                      echo "Set GOOGLE_PLAY_CLOSED_TRACK at the top of this workflow for push-based deploys,"
                      echo "or provide the play_track workflow_dispatch input for manual runs."
                      echo "Google Play closed testing tracks use custom names, so this workflow cannot infer one automatically."
                      exit 1
                  fi

                  echo "play_track=$play_track" >> "$GITHUB_OUTPUT"

            - name: Create keystore from secret
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
              shell: bash

            - name: Compute CI build number
              id: versioning
              env:
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  set -euo pipefail

                  # Google Play requires a unique, increasing versionCode for every upload.
                  build_number=$((RUN_NUMBER * 100 + RUN_ATTEMPT))

                  echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "Using Android build number: $build_number"

            - name: Build app bundle
              env:
                  KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
                  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
              run: flutter build appbundle --release --build-number=${{
                  steps.versioning.outputs.build_number }}

            - name: Generate Play release notes from commit messages
              id: release_notes
              env:
                  INPUT_RANGE: ${{ github.event.inputs.commit_range }}
                  BEFORE_SHA: ${{ github.event.before }}
                  CURRENT_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  whatsnew_dir="$RUNNER_TEMP/whatsnew"
                  notes_file="$whatsnew_dir/whatsnew-en-US"
                  mkdir -p "$whatsnew_dir"

                  commit_range="${INPUT_RANGE:-}"
                  if [ -z "$commit_range" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                      commit_range="$BEFORE_SHA..$CURRENT_SHA"
                  fi

                  if [ -z "$commit_range" ]; then
                      if git rev-parse HEAD^ >/dev/null 2>&1; then
                          commit_range="HEAD^..HEAD"
                      else
                          commit_range="HEAD"
                      fi
                  fi

                  git log --format='- %s' --no-merges "$commit_range" > "$notes_file"

                  if [ ! -s "$notes_file" ]; then
                      git log --format='- %s' -n 1 "$CURRENT_SHA" > "$notes_file"
                  fi

                  echo "whatsnew_dir=$whatsnew_dir" >> "$GITHUB_OUTPUT"
                  echo "commit_range=$commit_range" >> "$GITHUB_OUTPUT"

            - name: Upload to Google Play (Closed Testing)
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
                  packageName: com.silvernet.sggw_days
                  releaseFiles: "build/app/outputs/bundle/release/app-release.aab"
                  tracks: ${{ steps.resolve_track.outputs.play_track }}
                  status: draft
                  whatsNewDirectory: ${{ steps.release_notes.outputs.whatsnew_dir }}
                  mappingFile: build/app/outputs/mapping/release/mapping.txt

            - name: Clean up sensitive files
              if: always()
              run: |
                  rm -f android/app/upload-keystore.jks
