name: iOS Store Release

on:
    push:
        tags:
            - "v*.*.*"
            - "*.*.*"
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            target:
                description: Store target to run manually.
                required: true
                type: choice
                options:
                    - testflight
                    - app_store
            release_version:
                description: Optional semver release version (for example 1.2.3). Tag pushes and
                    GitHub Releases derive this automatically.
                required: false
                type: string
            build_number:
                description: Optional CFBundleVersion override. Tag builds and App Store
                    submissions default to the semver-derived build number.
                required: false
                type: string
            commit_range:
                description: Optional git revision range for autogenerated TestFlight release
                    notes.
                required: false
                type: string
            wait_for_processing:
                description: Wait for App Store Connect processing to finish after TestFlight
                    upload.
                required: false
                default: true
                type: boolean
            automatic_release:
                description: Automatically release after App Review approval for App Store
                    submissions.
                required: false
                default: true
                type: boolean

permissions:
    contents: read

concurrency:
    group: "ios-store-${{ github.event.inputs.target ||
        github.event.release.tag_name || github.ref }}"
    cancel-in-progress: true

env:
    IOS_DEFAULT_BUNDLE_IDENTIFIER: com.silvernet.sggwDays
    IOS_DEFAULT_BUILD_NUMBER_OFFSET: 1000

jobs:
    resolve:
        if: "${{ github.event_name != 'release' || (!github.event.release.draft &&
            !github.event.release.prerelease) }}"
        runs-on: ubuntu-latest
        outputs:
            target: ${{ steps.resolve.outputs.target }}
            build_name: ${{ steps.resolve.outputs.build_name }}
            build_number: ${{ steps.resolve.outputs.build_number }}
            bundle_identifier: ${{ steps.resolve.outputs.bundle_identifier }}
            release_version: ${{ steps.resolve.outputs.release_version }}
            release_tag: ${{ steps.resolve.outputs.release_tag }}
            wait_for_processing: ${{ steps.resolve.outputs.wait_for_processing }}
            automatic_release: ${{ steps.resolve.outputs.automatic_release }}
        steps:
            - name: Resolve iOS store configuration
              id: resolve
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  INPUT_TARGET: ${{ github.event.inputs.target }}
                  INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
                  INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
                  BUILD_NUMBER_OFFSET: ${{ vars['IOS_BUILD_NUMBER_OFFSET'] }}
                  DEFAULT_BUILD_NUMBER_OFFSET: ${{ env.IOS_DEFAULT_BUILD_NUMBER_OFFSET }}
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  INPUT_WAIT_FOR_PROCESSING: ${{ github.event.inputs.wait_for_processing }}
                  INPUT_AUTOMATIC_RELEASE: ${{ github.event.inputs.automatic_release }}
                  IOS_BUNDLE_IDENTIFIER: ${{ vars['IOS_BUNDLE_IDENTIFIER'] }}
                  DEFAULT_IOS_BUNDLE_IDENTIFIER: ${{ env.IOS_DEFAULT_BUNDLE_IDENTIFIER }}
                  IOS_APPSTORE_AUTOMATIC_RELEASE: ${{ vars['IOS_APPSTORE_AUTOMATIC_RELEASE'] }}
                  APPSTORE_ISSUER_ID: ${{ vars['APPSTORE_ISSUER_ID'] }}
                  APPSTORE_API_KEY_ID: ${{ vars['APPSTORE_API_KEY_ID'] }}
                  APPSTORE_API_PRIVATE_KEY: ${{ secrets['APPSTORE_API_PRIVATE_KEY'] }}
              run: |
                  set -euo pipefail

                  is_missing() {
                    local value="$1"
                    [ -z "$value" ] || [ "$value" = "REPLACE_ME" ]
                  }

                  target="${INPUT_TARGET:-}"
                  if [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    target="testflight"
                  elif [ "$EVENT_NAME" = "release" ]; then
                    target="app_store"
                  fi

                  case "$target" in
                    testflight|app_store)
                      ;;
                    *)
                      echo "iOS target must be testflight or app_store, got: ${target:-<empty>}"
                      exit 1
                      ;;
                  esac

                  release_version="${INPUT_RELEASE_VERSION:-}"
                  if [ "$target" = "testflight" ] && [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    release_version="$REF_NAME"
                  elif [ "$target" = "app_store" ] && [ "$EVENT_NAME" = "release" ]; then
                    release_version="${RELEASE_TAG:-$release_version}"
                  fi

                  release_version="${release_version#refs/tags/}"
                  release_version="${release_version#v}"

                  build_name=""
                  build_number="${INPUT_BUILD_NUMBER:-}"

                  if [ -n "$release_version" ]; then
                    if ! [[ "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "Release version must match X.Y.Z or vX.Y.Z for store deployment, got: $release_version"
                      exit 1
                    fi

                    major="${BASH_REMATCH[1]}"
                    minor="${BASH_REMATCH[2]}"
                    patch="${BASH_REMATCH[3]}"

                    if [ "$major" -gt 2099 ] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
                      echo "Release version components must satisfy major <= 2099, minor <= 99, patch <= 99."
                      exit 1
                    fi

                    build_name="$release_version"
                    if [ -z "$build_number" ]; then
                      build_number=$((major * 1000000 + minor * 10000 + patch * 100 + 1))
                    fi
                  elif [ "$target" = "app_store" ]; then
                    echo "release_version is required for App Store submissions."
                    exit 1
                  fi

                  if [ -z "$build_number" ]; then
                    build_number_offset="${BUILD_NUMBER_OFFSET:-$DEFAULT_BUILD_NUMBER_OFFSET}"
                    build_number=$((build_number_offset + (RUN_NUMBER * 100) + RUN_ATTEMPT))
                  fi

                  if ! [[ "$build_number" =~ ^[0-9]+$ ]]; then
                    echo "iOS build number must be a positive integer, got: $build_number"
                    exit 1
                  fi

                  bundle_identifier="${IOS_BUNDLE_IDENTIFIER:-$DEFAULT_IOS_BUNDLE_IDENTIFIER}"
                  if [ -z "$bundle_identifier" ]; then
                    echo "IOS_BUNDLE_IDENTIFIER is required."
                    exit 1
                  fi

                  missing=0
                  for name in APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY; do
                    if is_missing "${!name:-}"; then
                      echo "Missing required iOS deployment setting: $name"
                      missing=1
                    fi
                  done

                  if [ "$missing" -ne 0 ]; then
                    exit 1
                  fi

                  wait_for_processing="true"
                  if [ "${INPUT_WAIT_FOR_PROCESSING:-true}" = "false" ]; then
                    wait_for_processing="false"
                  fi

                  automatic_release="${INPUT_AUTOMATIC_RELEASE:-}"
                  if [ -z "$automatic_release" ]; then
                    automatic_release="${IOS_APPSTORE_AUTOMATIC_RELEASE:-true}"
                  fi

                  automatic_release=$(printf '%s' "$automatic_release" | tr '[:upper:]' '[:lower:]')
                  case "$automatic_release" in
                    true|false)
                      ;;
                    *)
                      echo "automatic_release must be true or false, got: $automatic_release"
                      exit 1
                      ;;
                  esac

                  echo "target=$target" >> "$GITHUB_OUTPUT"
                  echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
                  echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "bundle_identifier=$bundle_identifier" >> "$GITHUB_OUTPUT"
                  echo "release_tag=${RELEASE_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
                  echo "wait_for_processing=$wait_for_processing" >> "$GITHUB_OUTPUT"
                  echo "automatic_release=$automatic_release" >> "$GITHUB_OUTPUT"

    validate:
        needs: resolve
        if: ${{ needs.resolve.outputs.target == 'testflight' }}
        uses: ./.github/workflows/flutter-validate.yml

    build_and_upload:
        needs:
            - resolve
            - validate
        if: ${{ needs.resolve.outputs.target == 'testflight' }}
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup project tooling
              uses: ./.github/actions/setup-project

            - name: Resolve iOS signing mode
              id: signing
              env:
                  MATCH_PASSWORD: ${{ secrets['MATCH_PASSWORD'] }}
                  APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets['APPSTORE_CERTIFICATES_FILE_BASE64'] }}
                  APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets['APPSTORE_CERTIFICATES_PASSWORD'] }}
                  IOS_APPSTORE_PROFILE_BASE64: ${{ secrets['IOS_APPSTORE_PROFILE_BASE64'] }}
              run: |
                  set -euo pipefail

                  is_missing() {
                    local value="$1"
                    [ -z "$value" ] || [ "$value" = "REPLACE_ME" ]
                  }

                  if ! is_missing "${MATCH_PASSWORD:-}"; then
                    echo "mode=match" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  missing=0
                  for name in APPSTORE_CERTIFICATES_FILE_BASE64 APPSTORE_CERTIFICATES_PASSWORD IOS_APPSTORE_PROFILE_BASE64; do
                    if is_missing "${!name:-}"; then
                      echo "Missing required direct-signing setting: $name"
                      missing=1
                    fi
                  done

                  if [ "$missing" -ne 0 ]; then
                    echo "Either configure MATCH_PASSWORD for fastlane match or provide the direct-signing secrets."
                    exit 1
                  fi

                  echo "mode=direct" >> "$GITHUB_OUTPUT"

            - name: Setup fastlane
              uses: ./.github/actions/setup-fastlane

            - name: Write GitHub Actions iOS overrides
              env:
                  IOS_BUNDLE_IDENTIFIER: ${{ needs.resolve.outputs.bundle_identifier }}
                  APPLE_TEAM_ID: ${{ vars['APPLE_TEAM_ID'] }}
                  IOS_GOOGLE_CLIENT_ID: ${{ vars['IOS_GOOGLE_CLIENT_ID'] }}
                  IOS_GOOGLE_SERVER_CLIENT_ID: ${{ vars['IOS_GOOGLE_SERVER_CLIENT_ID'] }}
                  IOS_GOOGLE_REVERSED_CLIENT_ID: ${{ vars['IOS_GOOGLE_REVERSED_CLIENT_ID'] }}
              run: |
                  set -euo pipefail

                  config_path="ios/Flutter/GitHubActions.xcconfig"
                  : > "$config_path"

                  write_setting() {
                    local key="$1"
                    local value="$2"
                    if [ -n "$value" ]; then
                      printf '%s = %s\n' "$key" "$value" >> "$config_path"
                    fi
                  }

                  write_setting APP_BUNDLE_IDENTIFIER "$IOS_BUNDLE_IDENTIFIER"
                  write_setting APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
                  write_setting GID_CLIENT_ID "${IOS_GOOGLE_CLIENT_ID:-}"
                  write_setting GID_SERVER_CLIENT_ID "${IOS_GOOGLE_SERVER_CLIENT_ID:-}"
                  write_setting GOOGLE_REVERSED_CLIENT_ID "${IOS_GOOGLE_REVERSED_CLIENT_ID:-}"

            - name: Prepare match authentication
              if: ${{ steps.signing.outputs.mode == 'match' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
                  echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"

            - name: Sync signing via fastlane match
              if: ${{ steps.signing.outputs.mode == 'match' }}
              env:
                  FASTLANE_DISABLE_COLORS: "1"
                  FASTLANE_SKIP_UPDATE_CHECK: "1"
                  APPSTORE_API_KEY_ID: ${{ vars['APPSTORE_API_KEY_ID'] }}
                  APPSTORE_ISSUER_ID: ${{ vars['APPSTORE_ISSUER_ID'] }}
                  APPSTORE_API_PRIVATE_KEY: ${{ secrets['APPSTORE_API_PRIVATE_KEY'] }}
                  IOS_BUNDLE_IDENTIFIER: ${{ needs.resolve.outputs.bundle_identifier }}
                  MATCH_PASSWORD: ${{ secrets['MATCH_PASSWORD'] }}
              run: fastlane ios sync_signing_readonly

            - name: Import code-signing certificates
              if: ${{ steps.signing.outputs.mode == 'direct' }}
              uses: apple-actions/import-codesign-certs@v7
              with:
                  p12-file-base64: ${{ secrets['APPSTORE_CERTIFICATES_FILE_BASE64'] }}
                  p12-password: ${{ secrets['APPSTORE_CERTIFICATES_PASSWORD'] }}

            - name: Install App Store provisioning profile
              if: ${{ steps.signing.outputs.mode == 'direct' }}
              env:
                  IOS_APPSTORE_PROFILE_BASE64: ${{ secrets['IOS_APPSTORE_PROFILE_BASE64'] }}
              run: |
                  set -euo pipefail

                  profile_path="$RUNNER_TEMP/sggw-days-appstore.mobileprovision"
                  profile_plist="$RUNNER_TEMP/sggw-days-appstore.plist"

                  python3 - <<'PY'
                  import base64
                  import os

                  payload = os.environ['IOS_APPSTORE_PROFILE_BASE64']
                  output_path = os.path.join(os.environ['RUNNER_TEMP'], 'sggw-days-appstore.mobileprovision')

                  with open(output_path, 'wb') as output_file:
                      output_file.write(base64.b64decode(payload))
                  PY
                  security cms -D -i "$profile_path" > "$profile_plist"

                  profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
                  mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
                  cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

            - name: Build signed iOS archive
              env:
                  BUILD_NAME: ${{ needs.resolve.outputs.build_name }}
                  BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
                  IOS_BUNDLE_IDENTIFIER: ${{ needs.resolve.outputs.bundle_identifier }}
                  IOS_FIREBASE_API_KEY: ${{ vars['IOS_FIREBASE_API_KEY'] }}
                  IOS_FIREBASE_APP_ID: ${{ vars['IOS_FIREBASE_APP_ID'] }}
                  IOS_FIREBASE_MESSAGING_SENDER_ID: ${{ vars['IOS_FIREBASE_MESSAGING_SENDER_ID'] }}
                  IOS_FIREBASE_PROJECT_ID: ${{ vars['IOS_FIREBASE_PROJECT_ID'] }}
                  IOS_FIREBASE_STORAGE_BUCKET: ${{ vars['IOS_FIREBASE_STORAGE_BUCKET'] }}
                  IOS_FIREBASE_CLIENT_ID: ${{ vars['IOS_FIREBASE_CLIENT_ID'] }}
                  IOS_FIREBASE_BUNDLE_ID: ${{ vars['IOS_FIREBASE_BUNDLE_ID'] }}
              run: |
                  set -euo pipefail

                  build_args=(
                    --release
                    --build-number "$BUILD_NUMBER"
                    --no-tree-shake-icons
                  )

                  if [ -n "${BUILD_NAME:-}" ]; then
                    build_args+=(--build-name "$BUILD_NAME")
                  fi

                  dart_defines=()

                  append_define() {
                    local key="$1"
                    local value="$2"
                    if [ -n "$value" ]; then
                      dart_defines+=("--dart-define=${key}=${value}")
                    fi
                  }

                  append_define IOS_FIREBASE_API_KEY "${IOS_FIREBASE_API_KEY:-}"
                  append_define IOS_FIREBASE_APP_ID "${IOS_FIREBASE_APP_ID:-}"
                  append_define IOS_FIREBASE_MESSAGING_SENDER_ID "${IOS_FIREBASE_MESSAGING_SENDER_ID:-}"
                  append_define IOS_FIREBASE_PROJECT_ID "${IOS_FIREBASE_PROJECT_ID:-}"
                  append_define IOS_FIREBASE_STORAGE_BUCKET "${IOS_FIREBASE_STORAGE_BUCKET:-}"
                  append_define IOS_FIREBASE_CLIENT_ID "${IOS_FIREBASE_CLIENT_ID:-}"
                  append_define IOS_FIREBASE_BUNDLE_ID "${IOS_FIREBASE_BUNDLE_ID:-$IOS_BUNDLE_IDENTIFIER}"

                  flutter build ipa "${build_args[@]}" "${dart_defines[@]}"

            - name: Generate TestFlight release notes
              id: release_notes
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_RANGE: ${{ github.event.inputs.commit_range }}
                  REF_TYPE: ${{ github.ref_type }}
                  CURRENT_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  commit_range="${INPUT_RANGE:-}"
                  if [ -z "$commit_range" ] && [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
                    previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_SHA}^" 2>/dev/null || true)
                    if [ -n "$previous_tag" ]; then
                      commit_range="$previous_tag..$CURRENT_SHA"
                    else
                      commit_range="$CURRENT_SHA"
                    fi
                  fi

                  if [ -z "$commit_range" ]; then
                    if git rev-parse HEAD^ >/dev/null 2>&1; then
                      commit_range="HEAD^..HEAD"
                    else
                      commit_range="HEAD"
                    fi
                  fi

                  notes=$(git log --format='- %s' --no-merges "$commit_range")
                  if [ -z "$notes" ]; then
                    notes=$(git log --format='- %s' -n 1 "$CURRENT_SHA")
                  fi

                  {
                    echo 'whats_new<<EOF'
                    echo "$notes"
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Upload build to TestFlight
              env:
                  FASTLANE_DISABLE_COLORS: "1"
                  FASTLANE_SKIP_UPDATE_CHECK: "1"
                  APPSTORE_API_KEY_ID: ${{ vars['APPSTORE_API_KEY_ID'] }}
                  APPSTORE_ISSUER_ID: ${{ vars['APPSTORE_ISSUER_ID'] }}
                  APPSTORE_API_PRIVATE_KEY: ${{ secrets['APPSTORE_API_PRIVATE_KEY'] }}
                  IOS_BUNDLE_IDENTIFIER: ${{ needs.resolve.outputs.bundle_identifier }}
                  TESTFLIGHT_CHANGELOG: ${{ steps.release_notes.outputs.whats_new }}
                  TESTFLIGHT_WAIT_FOR_PROCESSING: ${{ needs.resolve.outputs.wait_for_processing }}
              run: fastlane ios beta_testflight

            - name: Clean up signing material
              if: always()
              run: |
                  rm -f ios/Flutter/GitHubActions.xcconfig
                  rm -f "$RUNNER_TEMP/sggw-days-appstore.mobileprovision" "$RUNNER_TEMP/sggw-days-appstore.plist"

    submit_existing_build:
        needs: resolve
        if: ${{ needs.resolve.outputs.target == 'app_store' }}
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Prepare App Store release notes
              id: release_notes
              env:
                  RELEASE_BODY: ${{ github.event.release.body }}
                  RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
              run: |
                  set -euo pipefail

                  notes_path="$RUNNER_TEMP/appstore-release-notes.txt"
                  raw_notes="${RELEASE_BODY:-}"

                  if [ -z "$raw_notes" ]; then
                    current_sha="$GITHUB_SHA"
                    if [ -n "$RELEASE_TAG" ] && git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                      current_sha=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
                    fi

                    previous_tag=$(git describe --tags --abbrev=0 "${current_sha}^" 2>/dev/null || true)
                    if [ -n "$previous_tag" ]; then
                      raw_notes=$(git log --format='- %s' --no-merges "$previous_tag..$current_sha")
                    else
                      raw_notes=$(git log --format='- %s' --no-merges -n 5 "$current_sha")
                    fi
                  fi

                  printf '%s' "$raw_notes" > "$notes_path"

                  NOTES_PATH="$notes_path" python3 - <<'PY'
                  import os
                  from pathlib import Path

                  path = Path(os.environ['NOTES_PATH'])
                  text = path.read_text().replace('\r\n', '\n').strip()
                  if len(text) > 4000:
                      text = text[:3997].rstrip() + '...'
                  path.write_text(text)
                  PY

                  {
                    echo 'release_notes<<EOF'
                    cat "$notes_path"
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Setup fastlane
              uses: ./.github/actions/setup-fastlane

            - name: Submit existing build to App Store review
              env:
                  FASTLANE_DISABLE_COLORS: "1"
                  FASTLANE_SKIP_UPDATE_CHECK: "1"
                  APPSTORE_API_KEY_ID: ${{ vars['APPSTORE_API_KEY_ID'] }}
                  APPSTORE_ISSUER_ID: ${{ vars['APPSTORE_ISSUER_ID'] }}
                  APPSTORE_API_PRIVATE_KEY: ${{ secrets['APPSTORE_API_PRIVATE_KEY'] }}
                  APPSTORE_AUTOMATIC_RELEASE: ${{ needs.resolve.outputs.automatic_release }}
                  APPSTORE_RELEASE_NOTES: ${{ steps.release_notes.outputs.release_notes }}
                  APP_VERSION: ${{ needs.resolve.outputs.release_version }}
                  BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
                  IOS_BUNDLE_IDENTIFIER: ${{ needs.resolve.outputs.bundle_identifier }}
              run: fastlane ios submit_app_store_release
