# https://github.com/firebase/firebase-tools

name: Verify PR Builds
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  build_android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project
        with:
          java-version: "21"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk-pr-${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build_web:
    needs:
      - validate
      - build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup project tooling
        uses: ./.github/actions/setup-project

      - name: Build web
        run: >-
          flutter build web --wasm --release --no-tree-shake-icons --base-href
          "/"

      - name: Prepare web deploy files
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
        run: dart run tool/prepare_web_deploy.dart

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build-pr-${{ github.event.pull_request.number }}
          path: build/web
          if-no-files-found: error
