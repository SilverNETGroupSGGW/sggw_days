# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  build_android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup project tooling
        uses: ./.github/actions/setup-project
        with:
          java-version: "21"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk-pr-${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - validate
      - build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup project tooling
        uses: ./.github/actions/setup-project

      - name: Build web
        run: flutter build web --wasm --release --base-href "/"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGGW_DAYS }}
          projectId: sggw-days
