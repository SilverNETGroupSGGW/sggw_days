name: "Setup Project Tooling"
description: "Prepare optional Java or Node tooling, then install Flutter dependencies."

inputs:
  flutter-channel:
    description: "Flutter release channel to install."
    required: false
    default: "stable"
  flutter-cache:
    description: "Whether to enable Flutter SDK caching."
    required: false
    default: "true"
  java-version:
    description: "Java version to install for Android builds."
    required: false
    default: ""
  java-distribution:
    description: "Java distribution passed to actions/setup-java."
    required: false
    default: "temurin"
  node-version:
    description: "Node.js version to install for Firebase tooling."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache Android Gradle state
      if: ${{ inputs.java-version != '' }}
      uses: actions/cache@v5
      with:
        path: android/.gradle
        key: android-gradle-state-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
        restore-keys: |
          android-gradle-state-${{ runner.os }}-

    - name: Cache Android SDK components
      if: ${{ inputs.java-version != '' }}
      uses: actions/cache@v5
      with:
        path: |
          /usr/local/lib/android/sdk/cmake
          ~/.android/cache
        key: android-sdk-components-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          android-sdk-components-${{ runner.os }}-

    - name: Setup Java
      if: ${{ inputs.java-version != '' }}
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Node.js
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v6
      with:
        cache: npm
        node-version: ${{ inputs.node-version }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        cache: ${{ inputs.flutter-cache }}
        channel: ${{ inputs.flutter-channel }}

    - name: Get Flutter dependencies
      shell: bash
      run: flutter pub get
