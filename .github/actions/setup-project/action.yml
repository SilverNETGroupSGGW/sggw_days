name: "Setup Project Tooling"
description: "Prepare optional Java or Node tooling, then install Flutter dependencies."

inputs:
  install-flutter:
    description: "Whether to install Flutter and run flutter pub get."
    required: false
    default: "true"
  java-version:
    description: "Java version to install for Android builds."
    required: false
    default: ""
  node-version:
    description: "Node.js version to install for Firebase tooling."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache Android Gradle state
      if: ${{ inputs.java-version != '' }}
      uses: actions/cache@v5
      with:
        path: android/.gradle
        key: android-gradle-state-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
        restore-keys: |
          android-gradle-state-${{ runner.os }}-

    - name: Setup Java
      if: ${{ inputs.java-version != '' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Node.js
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: functions/package-lock.json

    - name: Setup Flutter
      if: ${{ inputs.install-flutter != 'false' }}
      uses: subosito/flutter-action@v2
      with:
        cache: true
        channel: stable

    - name: Get Flutter dependencies
      if: ${{ inputs.install-flutter != 'false' }}
      shell: bash
      run: flutter pub get

    - name: Install npm dependencies
      if: ${{ inputs.node-version != '' }}
      shell: bash
      run: npm ci --prefix functions
